<div class="page">
  <app-header [showNav]="false" backRoute="/dashboard" backLabel="← Voltar"></app-header>

  <main class="content">
    <div class="content-header">
      <h2>Vidros</h2>
      <button class="btn-primary" *ngIf="userContext.isStock()" (click)="showForm = !showForm">
        {{ showForm ? 'Cancelar' : '+ Novo Vidro' }}
      </button>
    </div>

    <div class="form-card" *ngIf="showForm">
      <h3>Novo Vidro</h3>
      <div class="field-row">
        <div class="field">
          <label>Tipo *</label>
          <input type="text" [(ngModel)]="newGlass.type" name="type" placeholder="Comum, Antirreflexo..."/>
        </div>
        <div class="field">
          <label>Descrição</label>
          <input type="text" [(ngModel)]="newGlass.description" name="description" placeholder="Descrição"/>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Preço por m² (R$)</label>
          <input type="number" [(ngModel)]="newGlass.pricePerSquareMeter" name="price" placeholder="45.00"/>
        </div>
        <div class="field">
          <label>Folga técnica (cm)</label>
          <input type="number" [(ngModel)]="newGlass.technicalGapCm" name="gap" placeholder="0.2"/>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-primary" (click)="save()">Salvar</button>
      </div>
    </div>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    <div *ngIf="loading" class="state">Carregando...</div>
    <div *ngIf="!loading && glasses.length === 0" class="state">Nenhum vidro cadastrado.</div>

    <table *ngIf="!loading && glasses.length > 0">
      <thead>
      <tr>
        <th>#</th>
        <th>Tipo</th>
        <th>Descrição</th>
        <th>Preço/m²</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let g of glasses">
        <td>{{ g.id }}</td>
        <td>{{ g.type }}</td>
        <td>{{ g.description }}</td>
        <td>{{ g.pricePerSquareMeter | currency:'BRL' }}</td>
      </tr>
      </tbody>
    </table>
  </main>
</div>
